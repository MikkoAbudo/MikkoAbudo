name: Refresh profile SVG

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render-profile.py"
      - ".profile/**"
      - ".github/workflows/update-uptime.yml"

permissions:
  contents: write

concurrency:
  group: profile-svg
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render profile SVGs
        run: python3 scripts/render-profile.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/profile-light.svg assets/profile-dark.svg; then
            echo "already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-light.svg assets/profile-dark.svg
          git commit -m "chore: refresh profile svg"
          git push
